name: measure

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Model id, e.g. opencode/big-pickle (empty = repo variable EVAL_MODEL or opencode/big-pickle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: measure

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'opencode/big-pickle' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install opencode
        run: |
          version="$(sed -n 's/^export OPENCODE_VERSION="\${OPENCODE_VERSION:-\([^}]*\)}"$/\1/p' versions.env)"
          [ -n "$version" ] || {
            echo "OPENCODE_VERSION introuvable dans versions.env" >&2
            exit 1
          }
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$version"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Measure
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          opencode --version
          node eval/measure.mjs --model "$EVAL_MODEL"
      - name: Record results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results
          if git diff --cached --quiet; then
            echo "no result changes to record"
            exit 0
          fi
          git commit -m "chore(eval): record scheduled measurement $(date +%F)"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
